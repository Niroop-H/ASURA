name: Public-source external smoke observations
on:
  schedule:
    - cron: '19 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asura-external-provider-smoke
  cancel-in-progress: false
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Observe public providers
        run: node scripts/probe-public-sources.cjs
      - name: Retain public evidence (not a signed ledger)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-source-smoke-${{ github.run_id }}
          path: artifacts/public-source-smoke.json
          if-no-files-found: warn
          retention-days: 14
